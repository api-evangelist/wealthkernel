idempotency:
  supported: true
  docs: https://docs.wealthkernel.com/docs/api/docs/help/Idempotency.md
  notes: >-
    WealthKernel publishes a dedicated Idempotency concept page. Idempotency keys let clients safely
    retry create/write requests without duplicating side effects (e.g. duplicate orders or deposits),
    which pairs with the platform's eventual-consistency model. The exact idempotency header name is
    documented on the reference help page linked above (not restated here to avoid asserting an
    unverified string).
eventual_consistency:
  supported: true
  docs: https://docs.wealthkernel.com/docs/api/docs/help/EventualConsistency.md
  notes: >-
    Writes are accepted and processed asynchronously; a resource created via POST may not be
    immediately readable and moves through states (e.g. accounts transition to Active). Poll or
    subscribe to webhooks rather than assuming read-after-write consistency.
