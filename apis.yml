aid: wealthkernel
name: WealthKernel
description: >-
  WealthKernel is a UK- and EU-regulated digital investing infrastructure provider that offers
  "investing as a service" through a single REST API. It supplies the building blocks fintechs,
  wealth managers and established businesses need to launch digital investing propositions:
  client onboarding with KYC/AML, tax-wrapper accounts (GIA, ISA, JISA, SIPP), account funding
  (BACS, CHAPS, open banking, direct debits), custody as a licensed UK custodian, fractional and
  multi-currency trading, portfolio management and rebalancing, cash savings, transfers, valuations,
  performance reporting and FCA transaction reporting. WealthKernel is authorised and regulated by
  the Financial Conduct Authority (FRN 723719), registered with Spain's CNMV, and ISO 27001:2022
  certified. The API is documented on Stoplight and secured with OAuth2 client-credentials via an
  OpenID Connect authorization server, with sandbox and production environments, webhooks and
  documented idempotency, pagination and eventual-consistency conventions.
